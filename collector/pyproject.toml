[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hu-probe-collector"
version = "0.1.0"
description = "TCP JSONL collector and session store for hu-probe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hu-probe-collector = "hu_probe_collector.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hu_probe_collector*"]
