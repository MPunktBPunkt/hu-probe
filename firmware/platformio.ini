; hu-probe — USB-MSC Head-Unit Messsonde (ESP32-S3)

[platformio]
default_envs = huprobe-s3
src_dir = src

[env]
platform = espressif32@6.4.0
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1
extra_scripts =
  pre:scripts/gen_build_id.py
  pre:scripts/gate01b_link.py
  pre:scripts/gen_ca_bundle.py
build_flags =
  -DFW_VERSION=\"0.3.8\"
  -DHUB_HOST_DEFAULT=\"192.168.178.113\"
  -DHUB_PORT_DEFAULT=8093
  -DCOLLECTOR_HOST_DEFAULT=\"192.168.178.187\"
  -DCOLLECTOR_PORT_DEFAULT=9100
  -DCORE_DEBUG_LEVEL=0
  -I include
  -I src

; TinyUSB OTG Device (MSC). MODE=1 = HW CDC — disabled MSC.
; Lab+Feld: N8R2 (8 MiB flash + 2 MiB quad PSRAM) — see docs/HARDWARE-YD-ESP32-S3.md
[env:huprobe-s3]
board = esp32-s3-devkitc-1
; 0.3.0: own table with a 1.5 MiB trips partition — change needs one cable flash.
board_build.partitions = partitions_huprobe_8mb.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${env.build_flags}
  -DHUPROBE_BOARD_S3=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
