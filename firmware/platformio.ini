; hu-probe — USB-MSC Head-Unit Messsonde (ESP32-S3)

[platformio]
default_envs = huprobe-s3
src_dir = src

[env]
platform = espressif32@6.4.0
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DFW_VERSION=\"0.2.2\"
  -DHUB_HOST_DEFAULT=\"192.168.178.113\"
  -DHUB_PORT_DEFAULT=8093
  -DCOLLECTOR_HOST_DEFAULT=\"192.168.178.187\"
  -DCOLLECTOR_PORT_DEFAULT=9100
  -DCORE_DEBUG_LEVEL=0
  -I include
  -I src

; TinyUSB OTG Device (MSC). MODE=1 = HW CDC — disabled MSC.
[env:huprobe-s3]
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${env.build_flags}
  -DHUPROBE_BOARD_S3=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
